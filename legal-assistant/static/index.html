<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Юридический ассистент</title>
<style>
:root {
  --bg: #f5f6f8; --panel: #ffffff; --text: #1d2330; --muted: #6b7385; --line: #e3e6ec;
  --accent: #c2410c; --accent-soft: #fff1e8; --user: #1f3a5f; --user-text: #fff;
  --mark: #ffe58a; --ok: #15803d; --warn: #b45309;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #14171c; --panel: #1c2027; --text: #e6e9ef; --muted: #9aa3b2; --line: #2c323c;
    --accent: #fb923c; --accent-soft: #2a1f17; --user: #2d4a73; --mark: #6b5a12; --ok: #4ade80; --warn: #fbbf24; }
}
* { box-sizing: border-box; }
body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); height: 100vh; }
.app { display: grid; grid-template-columns: minmax(0, 1fr) 420px; height: 100vh; }
header { padding: 14px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; background: var(--panel); }
header h1 { font-size: 17px; margin: 0; }
header .status { margin-left: auto; font-size: 12px; color: var(--muted); }
.chat { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); }
.messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.msg { max-width: 780px; padding: 12px 16px; border-radius: 12px; white-space: pre-wrap; word-wrap: break-word; }
.msg.user { align-self: flex-end; background: var(--user); color: var(--user-text); }
.msg.assistant { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); }
.msg .meta { margin-top: 8px; font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; white-space: normal; }
.chip { border: 1px solid var(--line); background: var(--accent-soft); color: var(--text); border-radius: 999px; padding: 2px 10px; font-size: 12px; cursor: pointer; }
.chip:hover { border-color: var(--accent); }
.badge-ok { color: var(--ok); }
.empty { color: var(--muted); text-align: center; margin: auto; max-width: 520px; }
.examples { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 14px; }
.examples button { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 8px; padding: 8px 12px; cursor: pointer; font: inherit; font-size: 13px; text-align: left; }
.examples button:hover { border-color: var(--accent); }
form { display: flex; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--line); background: var(--panel); }
textarea { flex: 1; resize: none; min-height: 46px; max-height: 160px; padding: 11px 14px; border: 1px solid var(--line); border-radius: 10px; font: inherit; background: var(--bg); color: var(--text); }
button.send { background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 0 18px; font: inherit; font-weight: 600; cursor: pointer; }
button.send:disabled { opacity: .5; cursor: default; }
button.ghost { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 8px; padding: 4px 10px; cursor: pointer; font: inherit; font-size: 12px; }
aside { display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; padding: 12px; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); font: inherit; cursor: pointer; }
.tabs button.active { color: var(--text); border-bottom-color: var(--accent); }
.pane { flex: 1; overflow-y: auto; padding: 16px; }
.src { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; cursor: pointer; }
.src:hover { border-color: var(--accent); }
.src .t { font-weight: 600; font-size: 13px; }
.src .l { color: var(--accent); font-size: 12px; }
.src .f { font-size: 13px; color: var(--muted); margin-top: 6px; white-space: pre-wrap; max-height: 140px; overflow: hidden; }
.doc-list .item { padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; }
.doc-list .item:hover { background: var(--bg); }
.doc-list .cat { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 12px 0 4px; }
.doc-text { white-space: pre-wrap; font-size: 13px; line-height: 1.55; }
.doc-text mark { background: var(--mark); color: inherit; border-radius: 3px; }
.doc-head { font-weight: 600; margin-bottom: 4px; }
.doc-status { color: var(--warn); font-size: 12px; margin-bottom: 10px; }
.typing { color: var(--muted); font-style: italic; }
details { margin-top: 6px; font-size: 12px; color: var(--muted); white-space: pre-wrap; }
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) 45vh; }
  .chat { border-right: 0; border-bottom: 1px solid var(--line); }
  .msg { max-width: 100%; }
  header, form { padding-left: 16px; padding-right: 16px; }
}
</style>
</head>
<body>
<div class="app">
  <section class="chat">
    <header>
      <h1>⚖️ Юридический ассистент</h1>
      <button class="ghost" id="reset" title="Начать новый диалог">Новый диалог</button>
      <span class="status" id="status">…</span>
    </header>
    <div class="messages" id="messages">
      <div class="empty" id="empty">
        Задайте вопрос по договорам, регламентам компании или законам из базы знаний.
        Ассистент отвечает только по документам базы и указывает подтверждающие положения.
        <div class="examples" id="examples"></div>
      </div>
    </div>
    <form id="form">
      <textarea id="input" placeholder="Например: какой срок приёмки по качеству по договору П-17/2024?" rows="1"></textarea>
      <button class="send" id="send" type="submit">Отправить</button>
    </form>
  </section>
  <aside>
    <div class="tabs">
      <button id="tab-sources" class="active">Источники ответа</button>
      <button id="tab-docs">База документов</button>
    </div>
    <div class="pane" id="pane"></div>
  </aside>
</div>
<script>
const EXAMPLES = [
  "Какая арендная плата по договору с ООО «Северный Склад» и до какого числа её нужно вносить?",
  "Договор на 12 млн рублей заключали в августе 2024 года. Нужно ли было одобрение генерального директора?",
  "Какой максимальный срок испытания можно установить главному бухгалтеру?",
  "Хочу взять оригинал договора из архива на четыре рабочих дня. Это разрешено?",
];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let history = [];
let lastAnswer = null;
let docs = [];
let tab = "sources";

function setTab(name) {
  tab = name;
  $("tab-sources").classList.toggle("active", name === "sources");
  $("tab-docs").classList.toggle("active", name === "docs");
  if (name === "sources") renderSources(); else renderDocList();
}
$("tab-sources").onclick = () => setTab("sources");
$("tab-docs").onclick = () => setTab("docs");

function renderSources() {
  const pane = $("pane");
  if (!lastAnswer) { pane.innerHTML = '<p class="typing">Здесь появятся положения документов, подтверждающие ответ.</p>'; return; }
  let html = "";
  if (lastAnswer.sources.length) {
    html += lastAnswer.sources.map((s, i) => `<div class="src" data-i="${i}"><div class="t">${esc(s.title)}</div><div class="l">${esc(s.locator || "")}</div><div class="f">${esc(s.fragment)}</div></div>`).join("");
  } else {
    html += '<p class="typing">Ответ не опирается на конкретные положения базы (например, это отказ или уточняющий вопрос).</p>';
  }
  if (lastAnswer.documents.length) {
    html += '<div class="cat" style="font-size:11px;color:var(--muted);text-transform:uppercase;margin:16px 0 6px">Документы, найденные поиском</div>';
    html += '<div class="doc-list">' + lastAnswer.documents.map((d) => `<div class="item" data-doc="${esc(d.doc_id)}">${esc(d.title)}</div>`).join("") + "</div>";
  }
  pane.innerHTML = html;
  pane.querySelectorAll(".src").forEach((el) => el.onclick = () => { const s = lastAnswer.sources[+el.dataset.i]; openDoc(s.doc_id, s.fragment); });
  pane.querySelectorAll(".item").forEach((el) => el.onclick = () => openDoc(el.dataset.doc));
}

function renderDocList() {
  const groups = { company: "Документы компании", law: "Законодательство" };
  let html = '<div class="doc-list">';
  for (const [cat, label] of Object.entries(groups)) {
    html += `<div class="cat">${label}</div>`;
    html += docs.filter((d) => d.category === cat).map((d) => `<div class="item" data-doc="${esc(d.doc_id)}">${esc(d.title)}${d.status ? ' <span class="doc-status">· ' + esc(d.status) + "</span>" : ""}</div>`).join("");
  }
  $("pane").innerHTML = html + "</div>";
  $("pane").querySelectorAll(".item").forEach((el) => el.onclick = () => openDoc(el.dataset.doc));
}

async function openDoc(docId, fragment) {
  const r = await fetch(`/api/documents/${encodeURIComponent(docId)}`);
  if (!r.ok) return;
  const d = await r.json();
  let body = esc(d.text);
  const frag = (fragment || "").trim().split("\n")[0].slice(0, 160);
  if (frag) {
    const pos = body.indexOf(esc(frag));
    if (pos >= 0) body = body.slice(0, pos) + "<mark id='hl'>" + body.slice(pos, pos + esc(frag).length) + "</mark>" + body.slice(pos + esc(frag).length);
  }
  $("pane").innerHTML = `<button class="ghost" id="back">← Назад</button><div style="height:10px"></div>
    <div class="doc-head">${esc(d.title)}</div>${d.status ? `<div class="doc-status">${esc(d.status)}</div>` : ""}
    <div class="doc-text">${body}</div>`;
  $("back").onclick = () => setTab(tab);
  const hl = document.getElementById("hl");
  if (hl) hl.scrollIntoView({ block: "center" });
}

function addMessage(role, text, data) {
  $("empty")?.remove();
  const el = document.createElement("div");
  el.className = "msg " + role;
  el.textContent = text;
  if (data) {
    const meta = document.createElement("div");
    meta.className = "meta";
    const chips = data.sources.map((s, i) => `<span class="chip" data-i="${i}">${esc(s.title.length > 38 ? s.title.slice(0, 36) + "…" : s.title)}${s.locator ? ", " + esc(s.locator) : ""}</span>`).join("");
    meta.innerHTML = chips + (data.verified ? '<span class="badge-ok">✓ самопроверка</span>' : "") + `<span>${data.seconds} с</span>`;
    el.appendChild(meta);
    if (data.analysis) {
      const det = document.createElement("details");
      det.innerHTML = "<summary>Ход рассуждения</summary>" + esc(data.analysis);
      el.appendChild(det);
    }
    meta.querySelectorAll(".chip").forEach((c) => c.onclick = () => { lastAnswer = data; const s = data.sources[+c.dataset.i]; openDoc(s.doc_id, s.fragment); });
  }
  $("messages").appendChild(el);
  $("messages").scrollTop = $("messages").scrollHeight;
  return el;
}

async function send(text) {
  text = text.trim();
  if (!text) return;
  $("input").value = "";
  $("send").disabled = true;
  addMessage("user", text);
  history.push({ role: "user", content: text });
  const wait = addMessage("assistant", "Ищу положения в базе знаний…");
  wait.classList.add("typing");
  try {
    const r = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ messages: history.slice(-20) }) });
    const data = await r.json();
    wait.remove();
    if (!r.ok) throw new Error(data.detail ? JSON.stringify(data.detail) : r.statusText);
    history.push({ role: "assistant", content: data.answer });
    lastAnswer = data;
    addMessage("assistant", data.answer, data);
    setTab("sources");
  } catch (e) {
    wait.remove();
    addMessage("assistant", "Ошибка запроса: " + e.message);
    history.pop();
  } finally {
    $("send").disabled = false;
    $("input").focus();
  }
}

$("form").onsubmit = (e) => { e.preventDefault(); send($("input").value); };
$("input").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send($("input").value); } });
$("reset").onclick = () => location.reload();
$("examples").innerHTML = EXAMPLES.map((q) => `<button>${esc(q)}</button>`).join("");
$("examples").querySelectorAll("button").forEach((b) => b.onclick = () => send(b.textContent));

(async () => {
  try {
    const h = await (await fetch("/api/health")).json();
    $("status").textContent = `${h.documents} документов · ${h.embeddings ? "гибридный поиск" : "BM25"} · ${h.llm_configured ? h.model : "LLM не настроена"}`;
    docs = await (await fetch("/api/documents")).json();
  } catch { $("status").textContent = "сервер недоступен"; }
  renderSources();
})();
</script>
</body>
</html>
